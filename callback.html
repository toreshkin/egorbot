<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Авторизация</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; }
    textarea { width: 100%; height: 120px; font-family: monospace; }
  </style>
</head>
<body>
  <h1>Авторизация TikTok</h1>
  <p id="status">Скопируй адрес этой страницы целиком и вставь в окно скрипта <code>auth_tiktok</code>:</p>
  <textarea id="url" readonly></textarea>
  <script>
    const box = document.getElementById("url");
    box.value = location.href;
    box.select();
    if (new URLSearchParams(location.search).get("error")) {
      document.getElementById("status").textContent = "TikTok вернул ошибку — см. адрес ниже:";
    }
  </script>
</body>
</html>
